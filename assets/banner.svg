  <text x="56" y="118" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Rachit Agrawal</text>
  <text x="56" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#58a6ff">Full-Stack Developer · AI Automation</text>
  <text x="56" y="194" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b949e">React · Node.js · Python · MCP &amp; workflow automation</text>

